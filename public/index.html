<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <style>
      /* Make the page look modern and centered with a dark theme. */
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
      }
      .card {
        width: min(92vw, 460px);
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.25);
        box-shadow: 0 20px 60px rgba(2, 6, 23, 0.35);
        border-radius: 24px;
        padding: 24px;
        backdrop-filter: blur(16px);
      }
      .display {
        background: #020617;
        border-radius: 16px;
        padding: 16px;
        font-size: 2rem;
        min-height: 72px;
        text-align: right;
        margin-bottom: 16px;
        overflow-x: auto;
      }
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        background: #1e293b;
        color: #f8fafc;
        cursor: pointer;
      }
      button.operator { background: #2563eb; }
      button.equal { background: #10b981; }
      button.clear { background: #f59e0b; }
      .result {
        margin-top: 14px;
        color: #cbd5e1;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Modern Calculator</h1>
      <!-- The display area shows the current input or the calculated result. -->
      <div class="display" id="display">0</div>
      <div class="buttons">
        <button class="clear" data-value="C">C</button>
        <button data-value="(">(</button>
        <button data-value=")">)</button>
        <button class="operator" data-value="/">/</button>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">*</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">-</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>
        <button data-value="0">0</button>
        <button data-value=".">.</button>
        <button data-value="^">^</button>
        <button class="equal" data-value="=">=</button>
      </div>
      <div class="result" id="result">Ready to calculate</div>
    </div>
    <script>
      // Grab the UI elements that need to change as the user interacts.
      const display = document.getElementById('display');
      const result = document.getElementById('result');
      let current = '';

      // Attach a click handler to every calculator button.
      document.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', async () => {
          const value = button.dataset.value;

          // Clear the current input.
          if (value === 'C') {
            current = '';
            display.textContent = '0';
            result.textContent = 'Ready to calculate';
            return;
          }

          // Send the expression to the FastAPI backend and show the result.
          if (value === '=') {
            if (!current) return;
            try {
              const response = await fetch('/api/calc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expression: current })
              });
              const data = await response.json();
              if (!response.ok) {
                result.textContent = data.detail || 'Invalid expression';
                return;
              }
              display.textContent = data.result;
              result.textContent = `${data.expression} = ${data.result}`;
              current = String(data.result);
            } catch (error) {
              result.textContent = 'Invalid expression';
            }
            return;
          }

          // Otherwise, build the expression one button at a time.
          current += value;
          display.textContent = current;
        });
      });
    </script>
  </body>
</html>
